name: trending-board

on:
  schedule:
    # UTC；对应北京时间 08:17 / 14:17 / 20:17 / 02:17
    - cron: "17 0,6,12,18 * * *"
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch trending boards
        run: python scripts/fetch_trending.py --sleep 2

      - name: Translate descriptions to Chinese
        run: python scripts/translate.py --sleep 1

      - name: Build single-file site
        run: python scripts/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
